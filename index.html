<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speed Bike Showroom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Speed Bike Showroom</h1>
        <p>Your dream bike is here</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Bikes</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <section class="container">
        <div class="bike-card">
            <h2>Sports Bike</h2>
            <p>High speed and powerful engine</p>
            <p class="price">₹2,50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="bike-card">
            <h2>Cruiser Bike</h2>
            <p>Comfortable for long rides</p>
            <p class="price">₹1,80,000</p>
            <button>Buy Now</button>
        </div>

        <div class="bike-card">
            <h2>Electric Bike</h2>
            <p>Eco-friendly and modern</p>
            <p class="price">₹1,20,000</p>
            <button>Buy Now</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Speed Bike Showroom | All Rights Reserved</p>
    </footer>

</body>
</html>
